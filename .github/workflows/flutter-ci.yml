name: build
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze .

      - name: Cache FlexDelegate library (macOS)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/flutter_litert
          key: flex-delegate-macos-v1.0.0

      - name: Run tests
        run: flutter test

      - name: Install Flex integration host dependencies
        working-directory: example/flex_test_host
        run: flutter pub get

      - name: Run Flex addon integration tests
        working-directory: example/flex_test_host
        run: flutter test -d macos integration_test

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze .

      - name: Cache FlexDelegate library (Linux)
        uses: actions/cache@v4
        with:
          path: ~/.cache/flutter_litert
          key: flex-delegate-linux-v1.0.0

      - name: Run tests
        run: flutter test

      - name: Install Flex integration host dependencies
        working-directory: example/flex_test_host
        run: flutter pub get

      - name: Run Flex addon integration tests
        working-directory: example/flex_test_host
        run: xvfb-run -a flutter test -d linux integration_test
