group 'com.hugocornellier.flutter_litert'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// AGP 9 ships built-in Kotlin and rejects the legacy Kotlin Gradle Plugin
// ("The 'org.jetbrains.kotlin.android' plugin is no longer required ...").
// Apply KGP only on AGP < 9. Declaring it here (even guarded) also stops the
// Flutter Gradle plugin from auto-applying KGP to this module, which would
// otherwise be force-applied and rejected under built-in Kotlin on AGP 9.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
if (agpMajor < 9) {
    apply plugin: 'kotlin-android'
}

android {
    compileSdkVersion 36
    namespace 'com.hugocornellier.flutter_litert'

    externalNativeBuild {
        cmake {
            path "../src/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion 21

    }
}

// When a Kotlin compile task exists (KGP on AGP < 9, or built-in Kotlin on
// AGP 8.11+/9), it defaults its JVM target to the JDK version (e.g. 21/22)
// and clashes with the Java 17 target ("Inconsistent JVM-target ... (17) and
// (21)"). Pin it to 17. Guarded so the AGP 9 + legacy-disabled case, where no
// Kotlin extension is registered, is skipped instead of erroring on kotlin {}.
if (project.extensions.findByName("kotlin") != null) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}


dependencies {
    def litert_version = "1.4.1"

    implementation("com.google.ai.edge.litert:litert:${litert_version}")
    implementation("com.google.ai.edge.litert:litert-gpu:${litert_version}")
}
