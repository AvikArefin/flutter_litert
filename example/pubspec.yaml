name: flutter_litert_example
description: Example app and integration-test host for flutter_litert.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_litert: ^2.8.3
  opencv_dart: ^2.2.1+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

dependency_overrides:
  flutter_litert:
    path: ../

flutter:
  assets:
    - assets/
    - assets/samples/
